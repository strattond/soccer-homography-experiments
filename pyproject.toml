[project]
name = "soccer-homography"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel Stratton", email = "dsstratton@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boxmot>=16.0.9",
    "duckdb>=1.5.5",
    "numpy>=2.4,<2.7",
    "nvidia-modelopt[all]>=0.45",
    "opencv-python>=4.13.0.90",
    "polars>=1.42.0",
    "pyarrow>=24.0.0",
    "supervision>=0.27.0",
    "tensorrt>=11.2.1.2",
    "torch==2.13.0+cu130",
    "torchvision==0.28.0+cu130",
    "ultralytics>=8.4.6",
]

[project.scripts]
soccer-homography-experiments = "soccer_homography_experiments:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
override-dependencies = [
    "onnxruntime-gpu >= 1.26.0"
]

[tool.yapf]
based_on_style = 'yapf'
spaces_before_comment = 2
split_before_logical_operator = true
align_closing_bracket_with_visual_indent = true
allow_multiline_lambdas = true
arithmetic_precedence_indication = true
coalesce_brackets = true
column_limit = 192
dedent_closing_brackets = true
disable_split_list_with_comment = true
indent_dictionary_value = true
indent_width = 2
join_multiple_lines = true
no_spaces_around_selected_binary_operators = false
space_inside_brackets = true
spaces_around_tuple_delimiters = true
split_before_arithmetic_operator = true
use_tabs = false